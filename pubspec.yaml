name: aetherStream
description: AetherStream (multi-comptes, playlist M3U, lecture, téléchargement)
publish_to: "none"

version: 1.8.20+70

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  http: ^1.6.0
  dio: ^5.5.0                       # téléchargement avec suivi de progression
  path_provider: ^2.1.5             # accéder aux répertoires locaux
  flutter_secure_storage: ^9.2.4    # stockage sécurisé
  connectivity_plus: ^7.0.0         # vérifier la connectivité réseau
  device_info_plus: ^12.2.0         # informations sur l'appareil
  permission_handler: ^12.0.1       # gestion des permissions
  media_store_plus: ^0.1.3          # enregistrer des fichiers multimédias dans la galerie
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  # open_file_plus supprimé : utilisait l'API v1 Flutter supprimée en CI
  # Remplacement : FileProvider + MethodChannel dans MainActivity.kt
  media_kit: ^1.1.11                 # player vidéo (libmpv)
  media_kit_video: ^1.2.4            # widget Video
  media_kit_libs_android_video: ^1.3.2 # libs natives Android
  screen_brightness: ^0.2.2         # contrôle luminosité (gestures player)
  wakelock_plus: ^1.3.3              # garder l'écran allumé pendant la lecture
  scrollable_positioned_list: ^0.3.8
  url_launcher: ^6.3.2
  package_info_plus: ^8.3.0         # lire la version courante de l'app
  xml: ^6.5.0                       # parsing XMLTV (EPG)
  cryptography: ^2.7.0              # AES-256-GCM + PBKDF2 (sauvegarde §10)
  file_picker: ^8.1.7               # sélection fichier .aether (import §10)
  qr_flutter: ^4.1.0                # génération QR code (§3c-8 pairing mobile→TV)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/AetherStreamIcon.png"
  min_sdk_android: 24

# §splashOff — Splash custom DÉSACTIVÉ. Les drawables `launch_background.xml`
# (Android ≤11) et styles `windowSplashScreenAnimatedIcon` (Android 12+) ont été
# édités à la main pour ne montrer qu'un fond uni (plus de logo). Ne PAS relancer
# `dart run flutter_native_splash:create` sans réactiver cette config — ça
# remplacerait nos drawables. Pour réactiver : décommenter le bloc ci-dessous +
# regénérer.
#
# flutter_native_splash:
#   android: true
#   ios: false
#   web: false
#   image: assets/splash/AetherStreamIconSplash.png
#   color: "#F5F5F5"
#   color_dark: "#000000"
#   background_image: assets/splash/AetherStreamSplash.png
#   background_image_dark: assets/splash/AetherStreamDarkSplash.png
#   android_12:
#     image: assets/splash/AetherStreamIconSplash.png
#     image_dark: assets/splash/AetherStreamIconSplash.png
#     color: "#F5F5F5"
#     color_dark: "#000000"
