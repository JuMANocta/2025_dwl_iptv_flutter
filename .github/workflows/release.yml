name: Build & Release APK

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build APK et créer la release
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Installer les dépendances
        run: flutter pub get

      - name: Analyser le code
        run: flutter analyze

      - name: Décoder le keystore
        run: echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/aetherstream.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Créer android/key.properties
        run: |
          echo "storeFile=/tmp/aetherstream.jks" > android/key.properties
          echo "storePassword=$STORE_PASSWORD"   >> android/key.properties
          echo "keyAlias=$KEY_ALIAS"             >> android/key.properties
          echo "keyPassword=$KEY_PASSWORD"       >> android/key.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build APK release (arm64)
        run: flutter build apk --split-per-abi --release

      - name: Renommer l'APK
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             build/app/outputs/flutter-apk/aetherstream.apk

      - name: Créer la release GitHub et uploader l'APK
        uses: softprops/action-gh-release@v2
        with:
          name: AetherStream ${{ github.ref_name }}
          files: build/app/outputs/flutter-apk/aetherstream.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
