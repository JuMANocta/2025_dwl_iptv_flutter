name: Build & Release APK

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build APK et créer la release
    runs-on: ubuntu-latest
    environment: aetherstream

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Synchroniser pubspec.yaml avec le tag git
        run: |
          # Extrait "1.2.7" depuis le tag "v1.2.7"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # Conserve le build number existant dans pubspec.yaml
          CURRENT_BUILD=$(grep '^version:' pubspec.yaml | grep -oP '\+\K[0-9]+')
          NEW_VERSION="${TAG_VERSION}+${CURRENT_BUILD}"
          sed -i "s/^version: .*/version: ${NEW_VERSION}/" pubspec.yaml
          echo "✅ Version APK : ${NEW_VERSION} (tag=${GITHUB_REF_NAME})"

      - name: Installer les dépendances
        run: flutter pub get

      - name: Analyser le code (non bloquant)
        run: flutter analyze --no-fatal-warnings || true

      - name: Build APK universel (téléphone + TV + Fire Stick — toutes architectures)
        run: flutter build apk --release
        # Produit : build/app/outputs/flutter-apk/app-release.apk

      - name: Décoder le keystore PKCS12
        run: echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/aetherstream_raw.p12
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Re-encoder le keystore en format compatible Java (PBE-SHA1-3DES)
        run: |
          # OpenSSL 3.x crée des PKCS12 avec des OIDs modernes (tag ASN.1 > 30)
          # incompatibles avec le parser DER de Java → re-export en algorithmes legacy
          openssl pkcs12 -in /tmp/aetherstream_raw.p12 \
            -passin pass:"$STORE_PASSWORD" \
            -nodes -out /tmp/aetherstream_key.pem
          openssl pkcs12 -export \
            -in /tmp/aetherstream_key.pem \
            -passout pass:"$STORE_PASSWORD" \
            -keypbe PBE-SHA1-3DES \
            -certpbe PBE-SHA1-3DES \
            -macalg SHA1 \
            -name "$KEY_ALIAS" \
            -out /tmp/aetherstream.p12
          rm /tmp/aetherstream_key.pem /tmp/aetherstream_raw.p12
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.KEY_ALIAS }}

      - name: Signer l'APK avec apksigner
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "Build tools: $BUILD_TOOLS"
          $BUILD_TOOLS/apksigner sign \
            --ks /tmp/aetherstream.p12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$STORE_PASSWORD" \
            --key-pass pass:"$STORE_PASSWORD" \
            --out build/app/outputs/flutter-apk/aetherstream.apk \
            build/app/outputs/flutter-apk/app-release.apk
        env:
          KEY_ALIAS: ${{ vars.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Créer la release GitHub et uploader l'APK
        uses: softprops/action-gh-release@v2
        with:
          name: AetherStream ${{ github.ref_name }}
          files: build/app/outputs/flutter-apk/aetherstream.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
