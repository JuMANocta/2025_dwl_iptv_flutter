name: Build & Release APK

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build APK et créer la release
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Installer les dépendances
        run: flutter pub get

      - name: Analyser le code
        run: flutter analyze --no-fatal-warnings

      - name: Build APK release non signé (arm64)
        run: flutter build apk --split-per-abi --release

      - name: Décoder le keystore PKCS12
        run: echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/aetherstream.p12
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Signer l'APK avec apksigner
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "Build tools: $BUILD_TOOLS"
          $BUILD_TOOLS/apksigner sign \
            --ks /tmp/aetherstream.p12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$STORE_PASSWORD" \
            --key-pass pass:"$STORE_PASSWORD" \
            --out build/app/outputs/flutter-apk/aetherstream.apk \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
        env:
          KEY_ALIAS: ${{ vars.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Créer la release GitHub et uploader l'APK
        uses: softprops/action-gh-release@v2
        with:
          name: AetherStream ${{ github.ref_name }}
          files: build/app/outputs/flutter-apk/aetherstream.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
