name: Build & Release APK

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build APK et créer la release
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Installer les dépendances
        run: flutter pub get

      - name: Build APK release (arm64, non signé)
        run: flutter build apk --split-per-abi --release

      - name: Signer l'APK avec le keystore
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: build/app/outputs/flutter-apk
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ vars.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Renommer l'APK signé
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release-signed.apk \
            build/app/outputs/flutter-apk/aetherstream.apk

      - name: Créer la release GitHub et uploader l'APK
        uses: softprops/action-gh-release@v2
        with:
          name: AetherStream ${{ github.ref_name }}
          files: build/app/outputs/flutter-apk/aetherstream.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
